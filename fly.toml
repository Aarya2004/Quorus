# Quorus — single scale-to-zero machine + persistent SQLite volume.
# See ADR 0004 for scale-to-zero and ADR 0007 for stateless request handling.
# (Structure regenerated by `fly launch`; comments restored by hand.)

app = 'quorus'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'
  QUORUS_DB_PATH = '/data/quorus.db'

# SQLite lives on a persistent volume. WAL mode is safe on this local
# block device; it would NOT be on a network FS — another reason this
# deploy MUST stay single-machine.
[[mounts]]
  source = 'quorus_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  # Scale to zero when idle (cheapest dogfood host). Identity is bound per
  # request since ADR 0007 for both modern and legacy clients (stateless
  # fallback). Cold starts add latency and disconnect open streams; clients
  # reconnect and catch up with their seq cursor. No session map is lost.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
