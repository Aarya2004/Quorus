# Quorus — single scale-to-zero machine + persistent SQLite volume.
# See docs/adr/0004 for the scale-to-zero / ephemeral-session trade-off.
# (Structure regenerated by `fly launch`; comments restored by hand.)

app = 'quorus'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'
  QUORUS_DB_PATH = '/data/quorus.db'

# SQLite lives on a persistent volume. WAL mode is safe on this local
# block device; it would NOT be on a network FS — another reason this
# deploy MUST stay single-machine.
[[mounts]]
  source = 'quorus_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  # Scale to zero when idle (cheapest dogfood host). Identity is bound per
  # request since ADR 0007, so a cold start costs 2026-07-28 clients nothing
  # but latency. Legacy (2025-era) clients still see ADR 0004's
  # `404 unknown session` after idle and must re-initialize.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
